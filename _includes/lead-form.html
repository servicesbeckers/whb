<form class="lead-form" action="https://api.web3forms.com/submit" method="POST">
    <!-- Web3Forms access key (publiek-veilig; inzendingen gaan naar newleads@werkhuizenbeckers.be) -->
    <input type="hidden" name="access_key" value="db658052-43f2-4afb-837c-79c4810bb665">
    <input type="hidden" name="subject" value="Nieuwe aanmelding via werkhuizenbeckers.be">
    <input type="hidden" name="from_name" value="Werkhuizen Beckers — website">

    <!-- Honeypot tegen bots: mensen zien dit niet, bots vullen het in -->
    <input type="checkbox" name="botcheck" tabindex="-1" autocomplete="off" style="display:none" aria-hidden="true">

    <div class="lead-fields">
        <div>
            <label class="sr-only" for="lead-email">Uw e-mailadres</label>
            <input class="lead-input" id="lead-email" type="email" name="email" autocomplete="email" placeholder="uw@bedrijf.be">
        </div>
        <div>
            <label class="sr-only" for="lead-phone">Uw gsm- of telefoonnummer</label>
            <input class="lead-input" id="lead-phone" type="tel" name="telefoon" autocomplete="tel" placeholder="+32 4xx xx xx xx">
        </div>
    </div>

    <button class="button button-primary button-full" type="submit">Meld aan voor meer info</button>

    <label class="lead-consent">
        <input type="checkbox" name="toestemming" value="ja" required>
        <span>Ik geef Werkhuizen Beckers toestemming om met mij contact op te nemen via de gegevens die ik achterlaat. Zie de <a href="{{ '/privacy/' | relative_url }}">privacyverklaring</a>.</span>
    </label>

    <p class="lead-status" role="status" aria-live="polite"></p>
</form>

<script>
(function () {
    var forms = document.querySelectorAll('.lead-form');
    Array.prototype.forEach.call(forms, function (form) {
        if (form.dataset.bound) return;
        form.dataset.bound = '1';
        var status = form.querySelector('.lead-status');
        var btn = form.querySelector('button[type="submit"]');
        var email = form.querySelector('input[name="email"]');
        var phone = form.querySelector('input[name="telefoon"]');
        form.addEventListener('submit', function (e) {
            e.preventDefault();
            if (email && phone && !email.value.trim() && !phone.value.trim()) {
                status.className = 'lead-status is-error';
                status.textContent = 'Laat minstens een e-mailadres of een gsm-nummer achter.';
                return;
            }
            status.className = 'lead-status is-busy';
            status.textContent = 'Bezig met verzenden…';
            if (btn) btn.disabled = true;
            fetch(form.action, {
                method: 'POST',
                body: new FormData(form),
                headers: { 'Accept': 'application/json' }
            })
            .then(function (r) { return r.json(); })
            .then(function (res) {
                if (res.success) {
                    form.reset();
                    status.className = 'lead-status is-success';
                    status.textContent = 'Bedankt! We nemen zo snel mogelijk contact met u op.';
                } else {
                    status.className = 'lead-status is-error';
                    status.textContent = 'Verzenden lukte niet. Mail ons gerust rechtstreeks: info@werkhuizenbeckers.be';
                }
            })
            .catch(function () {
                status.className = 'lead-status is-error';
                status.textContent = 'Verzenden lukte niet. Mail ons gerust rechtstreeks: info@werkhuizenbeckers.be';
            })
            .finally(function () { if (btn) btn.disabled = false; });
        });
    });
})();
</script>
