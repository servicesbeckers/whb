privacy:
  titel: "Datenschutzerklärung"
  meta_description: "Wie Werkhuizen Beckers mit den Daten umgeht, die Sie über die Website, das Formular, WhatsApp oder per E-Mail übermitteln."
  bijgewerkt: "Zuletzt aktualisiert: 22. Oktober 2026."
  terug: "Zurück zur Startseite"
  secties:
    - titel: "Wer ist verantwortlich?"
      tekst: |
        Werkhuizen Beckers BV, Gingelom – Sint-Truiden, Belgien. USt-IdNr. BE 1041 720 216.

        Fragen zu dieser Erklärung: [info@werkhuizenbeckers.be](mailto:info@werkhuizenbeckers.be) oder [+32 476 06 32 85](tel:+32476063285).
    - titel: "Welche Daten werden verarbeitet?"
      tekst: |
        Nur das, was Sie selbst mitteilen:

        - **Über das Kontaktformular:** Name, Firma (optional), Telefonnummer und/oder E-Mail-Adresse, Ort, Ihre Beschreibung und ob es dringend ist.
        - **Per Telefon, WhatsApp oder E-Mail:** Ihre Kontaktdaten, Ihre Nachricht und die Fotos, die Sie mitschicken.

        Die Website selbst verwendet keine Cookies, keine Analyse- oder Werbedienste und lädt keine Schriften oder Skripte von anderen Websites. Wenn Sie den Sprachhinweis schließen, merkt sich Ihr Browser das lokal. Diese Information verlässt Ihr Gerät nicht.
    - titel: "Wer erhält die Daten?"
      tekst: |
        - **Web3Forms** empfängt den Inhalt des Formulars und leitet ihn per E-Mail an Werkhuizen Beckers weiter. Web3Forms handelt dabei als Auftragsverarbeiter. Mehr Informationen: [web3forms.com/privacy](https://web3forms.com/privacy).
        - **WhatsApp** (Meta) verarbeitet die Nachrichten, die Sie über WhatsApp schicken, nach den Bedingungen, die Sie mit WhatsApp vereinbart haben.
        - **GitHub** hostet die Website. Bei jedem Besuch verarbeitet GitHub technische Daten wie Ihre IP-Adresse, um die Seite ausliefern zu können.

        Werkhuizen Beckers verkauft Ihre Daten nicht und nutzt sie nicht für Werbung.
    - titel: "Warum und auf welcher Grundlage?"
      tekst: |
        Um Ihre Anfrage zu beantworten, eine Reparatur zu planen und auszuführen und um Rechnungen zu stellen. Rechtsgrundlage ist Ihre Einwilligung (über das Formular), die Vorbereitung oder Erfüllung eines Vertrags oder eine gesetzliche Pflicht wie die Buchhaltung (Art. 6 DSGVO). Ihre Einwilligung können Sie jederzeit widerrufen.
    - titel: "Wie lange werden sie gespeichert?"
      tekst: |
        Nicht länger als nötig. Anfragen ohne Auftrag werden spätestens nach zwei Jahren gelöscht. Daten, die auf einer Rechnung stehen, werden so lange aufbewahrt, wie es das Buchhaltungsrecht verlangt.
    - titel: "Ihre Rechte"
      tekst: |
        Sie können Ihre Daten einsehen, berichtigen oder löschen lassen, die Verarbeitung einschränken lassen und ihr widersprechen. Schreiben Sie dazu einfach an [info@werkhuizenbeckers.be](mailto:info@werkhuizenbeckers.be).

        Wenn Sie mit dem Umgang mit Ihren Daten nicht einverstanden sind, können Sie Beschwerde bei der belgischen Datenschutzbehörde einreichen: [www.datenschutzbehorde.be](https://www.datenschutzbehorde.be).
