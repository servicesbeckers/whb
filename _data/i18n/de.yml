  titel: "Lander Beckers"
  tekst:
    - "Ich bin Geschäftsführer von Werkhuizen Beckers und ausgebildeter Ingenieur. Trotzdem arbeite ich bewusst praktisch: Schweißen, schrauben und Fehler suchen passiert an der Maschine, nicht am Schreibtisch."
