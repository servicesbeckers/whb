faq:
  label: "Fragen"
  titel: "Häufige Fragen"
  items:
    - vraag: "Kommen Sie auch außerhalb von Limburg?"
      antwoord: "Ja. Der Haspengau, Flämisch-Brabant und die Provinz Lüttich gehören zu meinem festen Einsatzgebiet. Weiter entfernt nach Absprache."
    - vraag: "Muss die Maschine demontiert werden?"
      antwoord: "Meistens nicht. Ich schweiße und repariere dort, wo die Maschine steht. Muss doch ein Teil ab, um an die Schadstelle zu kommen, mache ich das vor Ort."
    - vraag: "Welche Werkstoffe schweißen Sie?"
      antwoord: "Stahl, Edelstahl und Aluminium. Mit Elektrode (E-Hand), MIG/MAG oder WIG, je nach Arbeit und Ort."
    - vraag: "Machen Sie auch Elektrik?"
      antwoord: "Nur an Maschinen: Motoren, Sensoren, Schaltschränke und die Verkabelung an der Maschine. Gebäudeelektrik mache ich nicht."
    - vraag: "Wie schicke ich ein Foto des Problems?"
      antwoord: "Per WhatsApp an +32 476 06 32 85. Schreiben Sie den Ort und eine kurze Beschreibung dazu."

