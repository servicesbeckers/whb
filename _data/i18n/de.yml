faq:
  label: "Fragen"
  titel: "Häufige Fragen"
  items:
    - vraag: "Kommen Sie auch außerhalb von Limburg?"
      antwoord: "Ja. Bis etwa eine Stunde Fahrt ab Gingelom: der Haspengau, Löwen, der Osten von Brüssel, Mecheln, Lüttich, Verviers und Namur. Weiter entfernt nach Absprache."
    - vraag: "Muss die Maschine demontiert werden?"
      antwoord: "Meistens nicht. Geschweißt und repariert wird dort, wo die Maschine steht. Muss doch ein Teil ab, um an die Schadstelle zu kommen, geschieht das vor Ort."
    - vraag: "Welche Werkstoffe schweißen Sie?"
      antwoord: "Stahl, Edelstahl, Aluminium und Gusseisen. Mit Elektrode (E-Hand), MIG/MAG oder WIG, je nach Arbeit und Ort. Verschlissene Teile können auch aufgepanzert werden."
    - vraag: "Machen Sie auch Elektrik?"
      antwoord: "Nur an Maschinen: Motoren, Sensoren, Schaltschränke und die Verkabelung an der Maschine. Gebäudeelektrik gehört nicht dazu."
    - vraag: "Machen Sie auch nur eine Zeichnung oder Konstruktion?"
      antwoord: "Ja. CAD-Konstruktion und Fertigungszeichnungen in Autodesk Inventor gibt es auch als eigenen Auftrag, zum Beispiel für eine Anpassung, eine Halterung oder ein Ersatzteil, das Sie anderswo fertigen lassen."
    - vraag: "Passen Sie auch Roboterprogramme an?"
      antwoord: "Ja, bei KUKA, ABB und FANUC. Zum Beispiel nach einer Reparatur oder einer Änderung an der Zelle, wenn Positionen oder Bahnen neu eingestellt werden müssen."
    - vraag: "Wie schicke ich ein Foto des Problems?"
      antwoord: "Per WhatsApp an +32 476 06 32 85 oder per E-Mail an info@werkhuizenbeckers.be. Schreiben Sie den Ort und eine kurze Beschreibung dazu."

