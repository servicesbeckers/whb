troeven:
  - titel: "Vor Ort"
    tekst: "Keine Demontage, kein Transport in eine Werkstatt. Die Maschine bleibt, wo sie steht."
  - titel: "Alles in einem Einsatz"
    tekst: "Schweißen, Mechanik, Maschinenelektrik, Pneumatik, Hydraulik und Steuerung. Sie rufen eine Nummer an, nicht drei Firmen."
  - titel: "Schnell einsatzbereit"
    tekst: "Auch wenn eine Maschine steht und dringend wieder laufen muss."
  - titel: "Konstruktion im Haus"
    tekst: "Jede Reparatur wird mit dem Blick eines Ingenieurs betrachtet: Warum ist es gebrochen, und wie verhindert man, dass es wieder passiert."

diensten:
  label: "Leistungen"
  titel: "Schweißen, instand setzen, konstruieren"
  items:
    - id: laswerk
      titel: "Schweißarbeiten vor Ort"
      tekst: "Reparieren, verstärken und anpassen, wo das Teil steht: Risse, gebrochene Teile, Halterungen, Rahmen und Einzelanfertigungen. Verschlissene Teile erhalten eine neue Verschleißschicht. Der Servicewagen ist für alle Schweißarbeiten vor Ort ausgerüstet."
      lijst:
        - "Stahl, Edelstahl und Aluminium"
        - "Gusseisen, mit Vorwärmen und kontrolliertem Abkühlen"
        - "Elektrode (E-Hand), MIG/MAG und WIG"
        - "Auftragschweißen und Panzern: Zähne, Messer, Schaufeln, Walzen, Wellen und Lagersitze"
        - "Abgerissene Schrauben ausbohren und Gewinde instand setzen"
        - "Konstruktions- und Sonderanfertigungen nach Absprache"
    - id: onderhoud
      titel: "Instandsetzung und Wartung"
      tekst: "Reparaturen an Stahl, Maschinen und Anlagen: mechanisch, elektrisch, pneumatisch, hydraulisch und Dampf. Oft gehört Schweißen dazu, aber nicht immer. Vorbeugende Wartung nach Vereinbarung oder Fehlersuche und Instandsetzung, wenn die Maschine stillsteht."
      lijst:
        - "Lager, Wellen, Antriebe und Führungen"
        - "Motoren, Sensoren und Schaltschränke von Maschinen"
        - "Zylinder, Ventile, Schläuche und Hydraulikleitungen"
        - "Dampfanlagen: Leitungen, Armaturen, Kondensatableiter und Halterungen"
      noot: "Elektrik nur an Maschinen, keine Gebäudeinstallationen. Schweißen an Dampfleitungen nach Absprache."
    - id: crash
      titel: "Maschine nach einem Unfall wieder in Betrieb"
      tekst: "Angefahren, umgekippt oder schwer beschädigt. Gebrochenes wird geschweißt, die Mechanik neu ausgerichtet, Elektrik, Pneumatik und Hydraulik instand gesetzt und die Maschine neu eingestellt, bis sie wieder produziert. Wo nötig, werden veraltete Teile oder Steuerungen ersetzt oder modernisiert."
      noot: "Schweißen, Mechanik, Elektrik und Steuerung in einem Einsatz."
    - id: engineering
      titel: "Konstruktion, Steuerung und Roboter"
      tekst: "Konstruktion und Zeichnungen in Autodesk Inventor: Anpassungen, Verstärkungen, Halterungen, Schutzabdeckungen und Ersatzteile. Im Rahmen einer Reparatur oder als eigener Auftrag. Dazu Anpassungen an der Maschinensteuerung und an Roboterprogrammen."
      lijst:
        - "CAD-Konstruktion und Fertigungszeichnungen (Autodesk Inventor)"
        - "Verschlissene oder gebrochene Teile aufmessen und nachzeichnen"
        - "SPS (PLC) und Maschinensteuerung anpassen"
        - "Roboterprogramme anpassen: KUKA, ABB und FANUC"
        - "Roboterzellen, Greifer und Vorrichtungen instand setzen"
    - id: spoed
      titel: "Notfalleinsatz"
      tekst: "Bei Stillstand oder Bruch, vor allem wenn geschweißt werden muss. Notfalleinsätze sind in erster Linie für Stammkunden da. Andere Anfragen werden je nach Verfügbarkeit geprüft."

