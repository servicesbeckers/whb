  plaat_titel: "Mobile Werkstatt"

troeven:
  - titel: "Ich komme zu Ihnen"
    tekst: "Keine Demontage, kein Transport in eine Werkstatt. Die Maschine bleibt, wo sie steht."
  - titel: "Eine Person für alles"
    tekst: "Schweißen, Mechanik, Maschinenelektrik, Pneumatik und Hydraulik. Sie rufen eine Nummer an, nicht drei Firmen."
  - titel: "Schnell einsatzbereit"
    tekst: "Auch wenn eine Maschine steht und dringend wieder laufen muss."
  - titel: "Ausgebildeter Ingenieur"
    tekst: "Ich verstehe, wie die Maschine funktioniert. Eine Reparatur ist mehr als eine Schweißnaht."

diensten:
  label: "Leistungen"
  titel: "Was ich vor Ort erledige"
  items:
    - id: laswerk
      titel: "Schweißarbeiten vor Ort"
      tekst: "Reparieren, verstärken und anpassen, wo das Teil steht: Risse, gebrochene Teile, Halterungen, Rahmen und Einzelanfertigungen. Mein Transporter hat die komplette Schweißausrüstung an Bord."
      lijst:
        - "Stahl, Edelstahl und Aluminium"
        - "Elektrode (E-Hand), MIG/MAG und WIG"
        - "Konstruktions- und Sonderanfertigungen nach Absprache"
    - id: onderhoud
      titel: "Wartung und Reparatur von Maschinen"
      tekst: "Mechanisch, elektrisch, pneumatisch und hydraulisch. Vorbeugende Wartung nach Vereinbarung oder Fehlersuche und Instandsetzung, wenn die Maschine stillsteht."
      lijst:
        - "Lager, Wellen, Antriebe und Führungen"
        - "Motoren, Sensoren und Schaltschränke von Maschinen"
        - "Zylinder, Ventile, Schläuche und Leitungen"
      noot: "Elektrik nur an Maschinen. Keine Gebäudeinstallationen."
    - id: crash
      titel: "Maschine nach einem Unfall wieder in Betrieb"
      tekst: "Angefahren, umgekippt oder schwer beschädigt. Ich schweiße, was gebrochen ist, richte die Mechanik neu aus, setze Elektrik, Pneumatik und Hydraulik instand und stelle die Maschine neu ein, bis sie wieder produziert. Wo nötig, ersetze oder modernisiere ich veraltete Teile oder Steuerungen."
      noot: "Schweißen, Mechanik und Elektrik in einem Einsatz, von einer Person."
    - id: spoed
      titel: "Notfalleinsatz"
      tekst: "Bei Stillstand oder Bruch, vor allem wenn geschweißt werden muss. Notfalleinsätze sind in erster Linie für Stammkunden da. Andere Anfragen prüfe ich je nach Verfügbarkeit."
  extra: "Wo nötig: CAD-Konstruktion (Autodesk Inventor) und Anpassungen an der Maschinensteuerung (Beckhoff/TwinCAT) als Teil einer Reparatur."

spoed:
  label: "Notfall"
  titel: "Maschine steht still?"
  tekst: "Für Stammkunden bin ich auch bei dringendem Stillstand da. Neukunde? Rufen Sie ruhig an, dann schaue ich, was möglich ist."

