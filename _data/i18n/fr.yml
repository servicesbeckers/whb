over:
  label: "À propos"
  titel: "Lander Beckers"
  tekst:
    - "Je suis ingénieur de formation et j'ai choisi de travailler de mes mains. Souder, réparer et chercher une panne, je préfère le faire devant la machine plutôt que derrière un bureau."
    - "Cette formation aide quand une réparation demande plus qu'un cordon de soudure. Je cherche pourquoi la pièce a cassé, pas seulement où."
    - "Au téléphone, c'est moi que vous avez, et c'est moi qui viens. En français, en néerlandais, en anglais ou en allemand."
  attesten_titel: "Attestations et assurance"
  attesten:
    - "VCA VOL"
    - "BA4 et BA5"
    - "Brevet de cariste"
    - "Assuré : RC exploitation et RC professionnelle"
