privacy:
  titel: "Déclaration de confidentialité"
  meta_description: "Comment Werkhuizen Beckers traite les données que vous transmettez via le site, le formulaire, WhatsApp ou par e-mail."
  bijgewerkt: "Dernière mise à jour : 22 octobre 2026."
  terug: "Retour à la page d'accueil"
  secties:
    - titel: "Qui est responsable ?"
      tekst: |
        Werkhuizen Beckers BV, Gingelom – Saint-Trond, Belgique. TVA BE 1041 720 216.

        Questions sur cette déclaration : [info@werkhuizenbeckers.be](mailto:info@werkhuizenbeckers.be) ou [+32 476 06 32 85](tel:+32476063285).
    - titel: "Quelles données je traite"
      tekst: |
        Uniquement ce que vous me transmettez vous-même :

        - **Via le formulaire de contact :** nom, entreprise (facultatif), numéro de téléphone et/ou adresse e-mail, commune ou lieu, votre description et l'indication d'urgence.
        - **Par téléphone, WhatsApp ou e-mail :** vos coordonnées, votre message et les photos que vous joignez.

        Le site lui-même n'utilise pas de cookies, pas d'outils d'analyse ou de publicité, et ne charge ni polices ni scripts depuis d'autres sites. Si vous fermez la suggestion de langue, votre navigateur s'en souvient localement. Cette information ne quitte pas votre appareil.
    - titel: "Qui reçoit ces données ?"
      tekst: |
        - **Web3Forms** reçoit le contenu du formulaire et me le transmet par e-mail. Web3Forms agit en tant que sous-traitant. Plus d'informations : [web3forms.com/privacy](https://web3forms.com/privacy).
        - **WhatsApp** (Meta) traite les messages que vous m'envoyez via WhatsApp, selon les conditions que vous avez acceptées chez WhatsApp.
        - **GitHub** héberge le site. À chaque visite, GitHub traite des données techniques comme votre adresse IP pour pouvoir afficher la page.

        Je ne vends pas vos données et je ne les utilise pas à des fins de marketing.
    - titel: "Pourquoi et sur quelle base ?"
      tekst: |
        Pour répondre à votre demande, planifier et effectuer une réparation, et pour facturer. La base légale est votre consentement (via le formulaire), la préparation ou l'exécution d'un contrat, ou une obligation légale comme la comptabilité (art. 6 RGPD). Vous pouvez retirer votre consentement à tout moment.
    - titel: "Combien de temps je les conserve"
      tekst: |
        Pas plus longtemps que nécessaire. Les demandes qui n'aboutissent pas à une commande sont supprimées au plus tard après deux ans. Les données qui figurent sur une facture sont conservées aussi longtemps que la législation comptable l'exige.
    - titel: "Vos droits"
      tekst: |
        Vous pouvez consulter vos données, les faire corriger ou supprimer, en limiter le traitement et vous y opposer. Envoyez simplement un e-mail à [info@werkhuizenbeckers.be](mailto:info@werkhuizenbeckers.be).

        Si vous n'êtes pas d'accord avec la manière dont je traite vos données, vous pouvez introduire une plainte auprès de l'Autorité de protection des données : [www.autoriteprotectiondonnees.be](https://www.autoriteprotectiondonnees.be).
