faq:
  label: "Questions"
  titel: "Questions fréquentes"
  items:
    - vraag: "Intervenez-vous aussi hors du Limbourg ?"
      antwoord: "Oui. La Hesbaye, le Brabant flamand et la province de Liège font partie de ma zone habituelle. Plus loin, c'est possible en concertation."
    - vraag: "Faut-il démonter la machine ?"
      antwoord: "Généralement pas. Je soude et je répare là où se trouve la machine. S'il faut quand même démonter une pièce pour y accéder, je le fais sur place."
    - vraag: "Quels matériaux soudez-vous ?"
      antwoord: "Acier, inox et aluminium. À l'électrode (MMA), en semi-automatique (MIG/MAG) ou en TIG, selon le travail et l'endroit."
    - vraag: "Faites-vous aussi de l'électricité ?"
      antwoord: "Uniquement sur les machines : moteurs, capteurs, armoires électriques et câblage de la machine. Je ne fais pas d'électricité de bâtiment."
    - vraag: "Comment envoyer une photo du problème ?"
      antwoord: "Par WhatsApp au +32 476 06 32 85. Ajoutez le lieu et une courte explication."

