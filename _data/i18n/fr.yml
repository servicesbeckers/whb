over:
  label: "À propos"
  titel: "Lander Beckers"
  tekst:
    - "Je suis le gérant de Werkhuizen Beckers et ingénieur de formation. Pourtant, je travaille volontairement sur le terrain : souder, réparer et chercher une panne, cela se fait devant la machine, pas derrière un bureau."
    - "Cette formation aide quand une réparation demande plus qu'un cordon de soudure. La question n'est pas seulement où la pièce a cassé, mais aussi pourquoi."
    - "Chez Werkhuizen Beckers, vous pouvez être servi en néerlandais, en anglais et en allemand."
  attesten_titel: "Attestations et assurance"
  attesten:
    - "VCA VOL"
    - "BA4 et BA5"
    - "Brevet de cariste"
    - "Assuré : RC exploitation et RC professionnelle"
  foto_alt: "Lander Beckers en train de souder chez un client"
  foto_bijschrift: "Lander Beckers, gérant"

faq:
  label: "Questions"
  titel: "Questions fréquentes"
  items:
    - vraag: "Intervenez-vous aussi hors du Limbourg ?"
      antwoord: "Oui. Jusqu'à environ une heure de route depuis Gingelom : la Hesbaye, Louvain, l'est de Bruxelles, Malines, Liège, Verviers et Namur. Plus loin, c'est possible en concertation."
    - vraag: "Faut-il démonter la machine ?"
      antwoord: "Généralement pas. La soudure et la réparation se font là où se trouve la machine. S'il faut quand même démonter une pièce pour y accéder, cela se fait sur place."
    - vraag: "Quels matériaux soudez-vous ?"
      antwoord: "Acier, inox, aluminium et fonte. À l'électrode (MMA), en semi-automatique (MIG/MAG) ou en TIG, selon le travail et l'endroit. Les pièces usées peuvent aussi être rechargées."
    - vraag: "Faites-vous aussi de l'électricité ?"
      antwoord: "Uniquement sur les machines : moteurs, capteurs, armoires électriques et câblage de la machine. L'électricité de bâtiment n'en fait pas partie."
    - vraag: "Pouvez-vous seulement réaliser un plan ou une conception ?"
      antwoord: "Oui. La conception CAO et les plans d'exécution dans Autodesk Inventor sont aussi possibles comme mission séparée, par exemple pour une modification, un support ou une pièce de remplacement que vous faites fabriquer ailleurs."
    - vraag: "Adaptez-vous aussi des programmes robots ?"
      antwoord: "Oui, pour KUKA, ABB et FANUC. Par exemple après une réparation ou une modification de la cellule, quand des positions ou des trajectoires doivent être réglées à nouveau."
    - vraag: "Comment envoyer une photo du problème ?"
      antwoord: "Par WhatsApp au +32 476 06 32 85 ou par e-mail à info@werkhuizenbeckers.be. Ajoutez le lieu et une courte explication."

