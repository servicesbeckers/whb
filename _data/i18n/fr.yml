troeven:
  - titel: "Sur place"
    tekst: "Pas de démontage, pas de transport vers un atelier. La machine reste là où elle est."
  - titel: "Tout en une intervention"
    tekst: "Soudure, mécanique, électricité machine, pneumatique, hydraulique et commande. Vous appelez un seul numéro, pas trois entreprises."
  - titel: "Disponible rapidement"
    tekst: "Aussi quand une machine est à l'arrêt et doit redémarrer d'urgence."
  - titel: "Ingénierie intégrée"
    tekst: "Chaque réparation est abordée avec un regard d'ingénieur : pourquoi la pièce a cassé, et comment éviter que cela se reproduise."

diensten:
  label: "Services"
  titel: "Souder, réparer, concevoir"
  items:
    - id: laswerk
      titel: "Soudure sur site"
      tekst: "Réparer, renforcer et modifier là où se trouve la pièce : fissures, pièces cassées, supports, châssis et pièces adaptées sur place. Les pièces usées reçoivent une nouvelle couche anti-usure. La camionnette de service est équipée pour tous les travaux de soudure sur place."
      lijst:
        - "Acier, inox et aluminium"
        - "Fonte, avec préchauffage et refroidissement contrôlé"
        - "Électrode (MMA), semi-automatique (MIG/MAG) et TIG"
        - "Rechargement dur et rechargement : dents, couteaux, palettes, rouleaux, arbres et portées de roulements"
        - "Extraction de boulons cassés et réparation de filetages"
        - "Construction métallique et sur mesure, en concertation"
    - id: onderhoud
      titel: "Réparation et entretien"
      tekst: "Réparations sur l'acier, les machines et les installations : mécanique, électricité, pneumatique, hydraulique et vapeur. Souvent avec de la soudure, mais pas toujours. Entretien préventif selon un planning convenu, ou recherche de panne et dépannage quand la machine s'arrête."
      lijst:
        - "Roulements, arbres, entraînements et guidages"
        - "Moteurs, capteurs et armoires électriques des machines"
        - "Vérins, distributeurs, flexibles et conduites hydrauliques"
        - "Installations vapeur : conduites, vannes, purgeurs et supports"
      noot: "Électricité uniquement sur les machines, pas d'installations de bâtiments. Soudure sur conduites vapeur en concertation."
    - id: crash
      titel: "Remettre en service une machine accidentée"
      tekst: "Percutée, renversée ou fortement endommagée. Ce qui est cassé est ressoudé, la mécanique réalignée, la partie électrique, pneumatique et hydraulique réparée, puis la machine est réglée jusqu'à ce qu'elle produise à nouveau. Si nécessaire, les pièces ou la commande obsolètes sont remplacées ou modernisées."
      noot: "Soudure, mécanique, électricité et commande en une seule intervention."
    - id: engineering
      titel: "Ingénierie, automatisme et robots"
      tekst: "Conception et dessin dans Autodesk Inventor : modifications, renforts, supports, protections et pièces de remplacement. Dans le cadre d'une réparation ou comme mission séparée. Également des adaptations de la commande machine et des programmes robots."
      lijst:
        - "Conception CAO et plans d'exécution (Autodesk Inventor)"
        - "Relevé et redessin de pièces usées ou cassées"
        - "Adaptation des automates (PLC) et de la commande machine"
        - "Adaptation de programmes robots : KUKA, ABB et FANUC"
        - "Réparation de cellules robotisées, préhenseurs et montages"
    - id: spoed
      titel: "Intervention urgente"
      tekst: "En cas d'arrêt ou de casse, surtout quand il faut souder. Les interventions urgentes sont d'abord réservées aux clients réguliers. Les autres demandes sont traitées selon les disponibilités."

spoed:
  label: "Urgence"
  titel: "Machine à l'arrêt ?"
  tekst: "Pour ses clients réguliers, Werkhuizen Beckers est aussi disponible en cas d'arrêt urgent. Nouveau client ? Appelez sans hésiter pour voir ce qui est possible."

