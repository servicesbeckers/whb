hero:
  label: "Gingelom · Hesbaye, Limbourg et région liégeoise"
  titel: "Soudure & réparation de machines sur site"
  tekst: "Je viens sur place avec ma camionnette équipée. Je soude l'acier, l'inox et l'aluminium, et je remets vos machines en marche, côté mécanique comme côté électrique."
  plaat:
    - [ "Travail", "Souder · réparer · régler" ]
    - [ "Matériau", "Acier · inox · alu" ]
    - [ "Procédé", "MMA · MIG/MAG · TIG" ]
    - [ "Départ", "Gingelom" ]
  plaat_titel: "Atelier mobile"

troeven:
  - titel: "Je viens sur place"
    tekst: "Pas de démontage, pas de transport vers un atelier. La machine reste là où elle est."
  - titel: "Une seule personne pour tout"
    tekst: "Soudure, mécanique, électricité machine, pneumatique et hydraulique. Vous appelez un seul numéro, pas trois entreprises."
  - titel: "Disponible rapidement"
    tekst: "Aussi quand une machine est à l'arrêt et doit redémarrer d'urgence."
  - titel: "Ingénieur de formation"
    tekst: "Je comprends comment la machine fonctionne. Une réparation, c'est plus qu'un cordon de soudure."

diensten:
  label: "Services"
  titel: "Ce que je fais sur place"
  items:
    - id: laswerk
      titel: "Soudure sur site"
      tekst: "Réparer, renforcer et modifier là où se trouve la pièce : fissures, pièces cassées, supports, châssis et pièces adaptées sur place. Ma camionnette transporte l'équipement de soudage complet."
      lijst:
        - "Acier, inox et aluminium"
        - "Électrode (MMA), semi-automatique (MIG/MAG) et TIG"
        - "Construction métallique et sur mesure, en concertation"
    - id: onderhoud
      titel: "Entretien et réparation de machines"
      tekst: "Mécanique, électricité, pneumatique et hydraulique. Entretien préventif selon un planning convenu, ou recherche de panne et dépannage quand la machine s'arrête."
      lijst:
        - "Roulements, arbres, entraînements et guidages"
        - "Moteurs, capteurs et armoires électriques des machines"
        - "Vérins, distributeurs, flexibles et conduites"
      noot: "Électricité uniquement sur les machines. Pas d'installations électriques de bâtiments."
    - id: crash
      titel: "Remettre en service une machine accidentée"
      tekst: "Percutée, renversée ou fortement endommagée. Je ressoude ce qui est cassé, je réaligne la mécanique, je répare la partie électrique, pneumatique et hydraulique, puis je règle la machine jusqu'à ce qu'elle produise à nouveau. Si nécessaire, je remplace ou je modernise les pièces ou la commande obsolètes."
      noot: "Soudure, mécanique et électricité en une seule intervention, par une seule personne."
    - id: spoed
      titel: "Intervention urgente"
      tekst: "En cas d'arrêt ou de casse, surtout quand il faut souder. Les interventions urgentes sont d'abord réservées à mes clients réguliers. Les autres demandes sont traitées selon mes disponibilités."
  extra: "Si nécessaire : conception CAO (Autodesk Inventor) et adaptations de la commande machine (Beckhoff/TwinCAT) dans le cadre d'une réparation."

spoed:
  label: "Urgence"
  titel: "Machine à l'arrêt ?"
  tekst: "Pour mes clients réguliers, je suis aussi disponible en cas d'arrêt urgent. Nouveau client ? Appelez sans hésiter, je verrai ce qui est possible."

