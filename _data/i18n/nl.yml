faq:
  label: "Vragen"
  titel: "Veelgestelde vragen"
  items:
    - vraag: "Komt u ook buiten Limburg?"
      antwoord: "Ja. Haspengouw, Vlaams-Brabant en de provincie Luik zitten in mijn vaste werkgebied. Verder weg kan in overleg."
    - vraag: "Moet de machine gedemonteerd worden?"
      antwoord: "Meestal niet. Ik las en herstel waar de machine staat. Moet er toch een onderdeel los om er goed bij te kunnen, dan doe ik dat ter plaatse."
    - vraag: "Welke materialen last u?"
      antwoord: "Staal, inox en aluminium. Met elektrode (MMA), halfautomaat (MIG/MAG) of TIG, afhankelijk van het werk en de plek."
    - vraag: "Doet u ook elektriciteit?"
      antwoord: "Enkel aan machines: motoren, sensoren, schakelkasten en de bekabeling op de machine. Elektriciteit in gebouwen doe ik niet."
    - vraag: "Hoe stuur ik een foto van het probleem?"
      antwoord: "Via WhatsApp naar +32 476 06 32 85. Zet er de locatie en een korte uitleg bij."

