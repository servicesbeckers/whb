troeven:
  - titel: "Ter plaatse"
    tekst: "Geen demontage en geen transport naar een werkplaats. De machine blijft staan waar ze staat."
  - titel: "Alles in één ingreep"
    tekst: "Lassen, mechanica, machine-elektriciteit, pneumatiek, hydrauliek en besturing. U belt één nummer, niet drie firma's."
  - titel: "Snel inzetbaar"
    tekst: "Ook als een machine stilstaat en dringend terug moet draaien."
  - titel: "Engineering in huis"
    tekst: "Elke herstelling wordt bekeken met de ogen van een engineer: waarom brak het, en hoe voorkomt u dat het opnieuw gebeurt."

diensten:
  label: "Diensten"
  titel: "Lassen, herstellen, ontwerpen"
  items:
    - id: laswerk
      titel: "Laswerk op locatie"
      tekst: "Herstellen, versterken en aanpassen waar het stuk staat: scheuren, gebroken onderdelen, steunen, frames en maatwerk. Versleten delen krijgen een nieuwe slijtlaag. De servicewagen heeft de volledige las- en snijuitrusting aan boord."
      lijst:
        - "Staal, inox en aluminium"
        - "Gietijzer, met voorwarmen en gecontroleerd afkoelen"
        - "Elektrode (MMA), halfautomaat (MIG/MAG) en TIG"
        - "Hardoplassen en opbouwlassen: tanden, messen, schoepen, rollen, assen en lagerzittingen"
        - "Plasmasnijden, autogeen snijden en gutsen"
        - "Afgebroken bouten uitboren, schroefdraad herstellen, kernboren met de magneetboor"
        - "Constructiewerk en maatwerk in overleg"
    - id: onderhoud
      titel: "Herstelling en onderhoud"
      tekst: "Herstellingen aan staal, machines en installaties: mechanisch, elektrisch, pneumatisch, hydraulisch en stoom. Vaak hoort er laswerk bij, maar niet altijd. Preventief onderhoud volgens afspraak, of een storing opsporen en verhelpen als de machine stilvalt."
      lijst:
        - "Lagers, assen, aandrijvingen en geleidingen"
        - "Motoren, sensoren en schakelkasten van machines"
        - "Cilinders, ventielen, slangen en hydraulische leidingen"
        - "Stoominstallaties: leidingen, afsluiters, condenspotten en ophangingen"
      noot: "Elektriciteit enkel aan machines, geen gebouwinstallaties. Laswerk aan stoomleidingen in overleg."
    - id: crash
      titel: "Machine terug in leven na een crash"
      tekst: "Aangereden, omgevallen of zwaar beschadigd. Wat gebroken is wordt opgelast, de mechaniek uitgelijnd, de elektrische, pneumatische en hydraulische kant hersteld en de machine opnieuw ingesteld tot ze weer produceert. Verouderde onderdelen of besturing worden waar nodig vervangen of gemoderniseerd."
      noot: "Lassen, mechanica, elektriciteit en besturing in één ingreep."
    - id: engineering
      titel: "Engineering, besturing en robots"
      tekst: "Ontwerp en tekenwerk in Autodesk Inventor: aanpassingen, versterkingen, steunen, afschermingen en vervangonderdelen. Dat kan bij een herstelling, maar ook als losse opdracht. Daarnaast aanpassingen aan de machinebesturing en aan robotprogramma's."
      lijst:
        - "CAD-ontwerp en werktekeningen (Autodesk Inventor)"
        - "Versleten of gebroken onderdelen opmeten en natekenen"
        - "Machinebesturing aanpassen (Beckhoff/TwinCAT)"
        - "Robotprogramma's aanpassen: KUKA, ABB en FANUC"
        - "Robotcellen, grijpers en opspanningen herstellen"
    - id: spoed
      titel: "Dringende interventie"
      tekst: "Bij stilstand of breuk, zeker als er gelast moet worden. Spoedinterventies zijn er in de eerste plaats voor vaste klanten. Andere aanvragen worden bekeken volgens beschikbaarheid."

