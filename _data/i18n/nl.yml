privacy:
  titel: "Privacyverklaring"
  meta_description: "Hoe Werkhuizen Beckers omgaat met de gegevens die u via de website, het formulier, WhatsApp of e-mail doorgeeft."
  bijgewerkt: "Laatst bijgewerkt: 22 oktober 2026."
  terug: "Terug naar de startpagina"
  secties:
    - titel: "Wie is verantwoordelijk?"
      tekst: |
        Werkhuizen Beckers BV, Gingelom – Sint-Truiden, België. BTW BE 1041 720 216.

        Vragen over deze verklaring: [info@werkhuizenbeckers.be](mailto:info@werkhuizenbeckers.be) of [+32 476 06 32 85](tel:+32476063285).
    - titel: "Welke gegevens verwerk ik?"
      tekst: |
        Enkel wat u zelf doorgeeft:

        - **Via het contactformulier:** naam, bedrijf (optioneel), telefoonnummer en/of e-mailadres, gemeente of locatie, uw omschrijving en of het dringend is.
        - **Via telefoon, WhatsApp of e-mail:** uw contactgegevens, uw bericht en de foto's die u meestuurt.

        De website zelf gebruikt geen cookies, geen analyse- of advertentiediensten en laadt geen lettertypes of scripts van andere sites. Klikt u de taalsuggestie weg, dan onthoudt uw browser dat lokaal. Die informatie verlaat uw toestel niet.
    - titel: "Wie krijgt die gegevens?"
      tekst: |
        - **Web3Forms** ontvangt de inhoud van het formulier en stuurt die per e-mail naar mij door. Web3Forms treedt daarbij op als verwerker. Meer informatie: [web3forms.com/privacy](https://web3forms.com/privacy).
        - **WhatsApp** (Meta) verwerkt de berichten die u mij via WhatsApp stuurt, volgens de voorwaarden die u met WhatsApp afsprak.
        - **GitHub** host de website. Bij elk bezoek verwerkt GitHub technische gegevens zoals uw IP-adres om de pagina te kunnen tonen.

        Ik verkoop uw gegevens niet en gebruik ze niet voor marketing.
    - titel: "Waarom en op welke basis?"
      tekst: |
        Om uw vraag te beantwoorden, een herstelling in te plannen en uit te voeren, en om te factureren. De rechtsgrond is uw toestemming (bij het formulier), het voorbereiden of uitvoeren van een overeenkomst, of een wettelijke verplichting zoals de boekhouding (art. 6 AVG). Uw toestemming kunt u altijd intrekken.
    - titel: "Hoe lang bewaar ik ze?"
      tekst: |
        Niet langer dan nodig. Aanvragen zonder opdracht verwijder ik na ten laatste twee jaar. Gegevens die op een factuur staan, bewaar ik zolang de boekhoudwetgeving dat vraagt.
    - titel: "Uw rechten"
      tekst: |
        U kan uw gegevens inzien, laten verbeteren of verwijderen, de verwerking laten beperken en er bezwaar tegen maken. Mail daarvoor naar [info@werkhuizenbeckers.be](mailto:info@werkhuizenbeckers.be).

        Bent u het niet eens met hoe ik met uw gegevens omga, dan kan u klacht indienen bij de Gegevensbeschermingsautoriteit: [www.gegevensbeschermingsautoriteit.be](https://www.gegevensbeschermingsautoriteit.be).
