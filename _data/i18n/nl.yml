over:
  label: "Over"
  titel: "Lander Beckers"
  tekst:
    - "Ik ben engineer van opleiding en werk bewust met mijn handen. Lassen, sleutelen en storingen zoeken doe ik liever bij de machine dan achter een bureau."
    - "Die achtergrond helpt als een herstelling meer vraagt dan een lasnaad. Ik kijk waarom iets brak, niet enkel waar."
    - "U krijgt mij aan de lijn en ik kom zelf. Dat kan in het Nederlands, Frans, Engels en Duits."
