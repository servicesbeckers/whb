troeven:
  - titel: "Ik kom ter plaatse"
    tekst: "Geen demontage en geen transport naar een werkplaats. De machine blijft staan waar ze staat."
  - titel: "Eén persoon voor alles"
    tekst: "Lassen, mechanica, machine-elektriciteit, pneumatiek en hydrauliek. U belt één nummer, niet drie firma's."
  - titel: "Snel inzetbaar"
    tekst: "Ook als een machine stilstaat en dringend terug moet draaien."
  - titel: "Engineer van opleiding"
    tekst: "Ik begrijp hoe de machine werkt. Een herstelling is meer dan een lasnaad."

diensten:
  label: "Diensten"
  titel: "Wat ik ter plaatse doe"
  items:
    - id: laswerk
      titel: "Laswerk op locatie"
      tekst: "Herstellen, versterken en aanpassen waar het stuk staat: scheuren, gebroken onderdelen, steunen, frames en maatwerk. Mijn bus heeft de volledige lasuitrusting aan boord."
      lijst:
        - "Staal, inox en aluminium"
        - "Elektrode (MMA), halfautomaat (MIG/MAG) en TIG"
        - "Constructiewerk en maatwerk in overleg"
    - id: onderhoud
      titel: "Onderhoud en herstelling van machines"
      tekst: "Mechanisch, elektrisch, pneumatisch en hydraulisch. Preventief onderhoud volgens afspraak, of een storing opsporen en verhelpen als de machine stilvalt."
      lijst:
        - "Lagers, assen, aandrijvingen en geleidingen"
        - "Motoren, sensoren en schakelkasten van machines"
        - "Cilinders, ventielen, slangen en leidingen"
      noot: "Elektriciteit enkel aan machines. Gebouwinstallaties doe ik niet."
    - id: crash
      titel: "Machine terug in leven na een crash"
      tekst: "Aangereden, omgevallen of zwaar beschadigd. Ik las op wat gebroken is, lijn mechanisch uit, herstel de elektrische, pneumatische en hydraulische kant en stel de machine opnieuw in tot ze weer produceert. Verouderde onderdelen of besturing vervang of moderniseer ik waar nodig."
      noot: "Lassen, mechanica en elektriciteit in één ingreep, door één persoon."
    - id: spoed
      titel: "Dringende interventie"
      tekst: "Bij stilstand of breuk, zeker als er gelast moet worden. Spoedinterventies zijn er in de eerste plaats voor vaste klanten. Andere aanvragen bekijk ik volgens beschikbaarheid."
  extra: "Waar nodig: CAD-ontwerp (Autodesk Inventor) en aanpassingen aan de machinebesturing (Beckhoff/TwinCAT) als onderdeel van een herstelling."

spoed:
  label: "Spoed"
  titel: "Machine stil?"
  tekst: "Voor vaste klanten sta ik ook bij dringende stilstand paraat. Nieuwe klant? Bel gerust, dan bekijk ik wat mogelijk is."

