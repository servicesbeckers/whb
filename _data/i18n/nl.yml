faq:
  label: "Vragen"
  titel: "Veelgestelde vragen"
  items:
    - vraag: "Komt u ook buiten Limburg?"
      antwoord: "Ja. Haspengouw, Vlaams-Brabant en de provincie Luik horen bij het vaste werkgebied. Verder weg kan in overleg."
    - vraag: "Moet de machine gedemonteerd worden?"
      antwoord: "Meestal niet. Lassen en herstellen gebeurt waar de machine staat. Moet er toch een onderdeel los om er goed bij te kunnen, dan gebeurt dat ter plaatse."
    - vraag: "Welke materialen last u?"
      antwoord: "Staal, inox, aluminium en gietijzer. Met elektrode (MMA), halfautomaat (MIG/MAG) of TIG, afhankelijk van het werk en de plek. Versleten delen kunnen ook hardopgelast worden."
    - vraag: "Doet u ook elektriciteit?"
      antwoord: "Enkel aan machines: motoren, sensoren, schakelkasten en de bekabeling op de machine. Elektriciteit in gebouwen valt erbuiten."
    - vraag: "Kan u ook enkel een tekening of ontwerp maken?"
      antwoord: "Ja. CAD-ontwerp en werktekeningen in Autodesk Inventor kunnen ook als losse opdracht, bijvoorbeeld voor een aanpassing, een steun of een vervangonderdeel dat u elders laat maken."
    - vraag: "Past u ook robotprogramma's aan?"
      antwoord: "Ja, bij KUKA, ABB en FANUC. Bijvoorbeeld na een herstelling of aanpassing aan de cel, wanneer posities of trajecten opnieuw ingesteld moeten worden."
    - vraag: "Hoe stuur ik een foto van het probleem?"
      antwoord: "Via WhatsApp naar +32 476 06 32 85 of per mail naar info@werkhuizenbeckers.be. Zet er de locatie en een korte uitleg bij."

