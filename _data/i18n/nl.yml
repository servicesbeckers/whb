  titel: "Lander Beckers"
  tekst:
    - "Ik ben zaakvoerder van Werkhuizen Beckers en engineer van opleiding. Toch werk ik bewust hands-on: lassen, sleutelen en storingen zoeken gebeurt bij de machine, niet achter een bureau."
