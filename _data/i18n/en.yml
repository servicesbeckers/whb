  foto_bijschrift: "Lander and the van with welding equipment"

faq:
  label: "FAQ"
  titel: "Frequently asked questions"
  items:
    - vraag: "Do you work outside Limburg?"
      antwoord: "Yes. Hesbaye, Flemish Brabant and the province of Liège are part of my regular area. Further afield is possible by arrangement."
    - vraag: "Does the machine need to be dismantled?"
      antwoord: "Usually not. I weld and repair where the machine stands. If a part has to come off to reach the damage, I do that on site."
    - vraag: "Which materials do you weld?"
      antwoord: "Steel, stainless steel and aluminium. Stick (MMA), MIG/MAG or TIG, depending on the job and the location."
    - vraag: "Do you do electrical work too?"
      antwoord: "On machines only: motors, sensors, control cabinets and the wiring on the machine. I do not work on building electrics."
    - vraag: "How do I send a photo of the problem?"
      antwoord: "Through WhatsApp to +32 476 06 32 85. Add the location and a short description."

