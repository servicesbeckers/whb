privacy:
  titel: "Privacy statement"
  meta_description: "How Werkhuizen Beckers handles the details you share through the website, the form, WhatsApp or email."
  bijgewerkt: "Last updated: 22 October 2026."
  terug: "Back to the home page"
  secties:
    - titel: "Who is responsible?"
      tekst: |
        Werkhuizen Beckers BV, Gingelom – Sint-Truiden, Belgium. VAT BE 1041 720 216.

        Questions about this statement: [info@werkhuizenbeckers.be](mailto:info@werkhuizenbeckers.be) or [+32 476 06 32 85](tel:+32476063285).
    - titel: "Which data I process"
      tekst: |
        Only what you give me yourself:

        - **Through the contact form:** name, company (optional), phone number and/or email address, town or location, your description and whether it is urgent.
        - **By phone, WhatsApp or email:** your contact details, your message and any photos you send.

        The website itself uses no cookies, no analytics or advertising services, and loads no fonts or scripts from other sites. If you close the language suggestion, your browser remembers that locally. That information does not leave your device.
    - titel: "Who receives the data?"
      tekst: |
        - **Web3Forms** receives the content of the form and forwards it to me by email. Web3Forms acts as a processor. More information: [web3forms.com/privacy](https://web3forms.com/privacy).
        - **WhatsApp** (Meta) processes the messages you send me through WhatsApp, under the terms you agreed with WhatsApp.
        - **GitHub** hosts the website. On every visit GitHub processes technical data such as your IP address in order to serve the page.

        I do not sell your data and do not use it for marketing.
    - titel: "Why, and on what basis?"
      tekst: |
        To answer your request, plan and carry out a repair, and to invoice. The legal basis is your consent (through the form), preparing or performing a contract, or a legal obligation such as bookkeeping (Article 6 GDPR). You can withdraw your consent at any time.
    - titel: "How long I keep it"
      tekst: |
        No longer than necessary. Requests that do not lead to a job are deleted after two years at the latest. Data that appears on an invoice is kept for as long as accounting law requires.
    - titel: "Your rights"
      tekst: |
        You can access your data, have it corrected or deleted, restrict its processing and object to it. Just send an email to [info@werkhuizenbeckers.be](mailto:info@werkhuizenbeckers.be).

        If you disagree with how I handle your data, you can lodge a complaint with the Belgian Data Protection Authority: [www.dataprotectionauthority.be](https://www.dataprotectionauthority.be).
