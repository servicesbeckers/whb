over:
  label: "About"
  titel: "Lander Beckers"
  tekst:
    - "I am an engineer by training and I choose to work with my hands. I would rather weld, fix and troubleshoot at the machine than sit behind a desk."
    - "That background helps when a repair takes more than a weld. I look at why something broke, not just where."
    - "When you call, you get me, and I come out myself. In English, Dutch, French or German."
  attesten_titel: "Certificates and insurance"
  attesten:
    - "VCA VOL safety certificate"
    - "BA4 and BA5 electrical qualifications"
    - "Forklift certificate"
    - "Insured: public and professional liability"
