hero:
  label: "Gingelom · up to an hour's drive"
  titel: "On-site welding & machine repair"
  tekst: "Werkhuizen Beckers comes to you with a fully equipped service van. Welding in steel, stainless steel and aluminium, and machines running again, mechanically and electrically."
  of: "Or directly"
  plaat:
    - [ "Work", "Weld · repair · engineer" ]
    - [ "Material", "Steel · stainless · alu · cast iron" ]
    - [ "Process", "MMA · MIG/MAG · TIG" ]
    - [ "Base", "Gingelom" ]
  plaat_titel: "Mobile workshop"

troeven:
  - titel: "On site"
    tekst: "No dismantling, no transport to a workshop. The machine stays where it is."
  - titel: "Everything in one job"
    tekst: "Welding, mechanics, machine electrics, pneumatics, hydraulics and controls. You call one number, not three companies."
  - titel: "Quick to deploy"
    tekst: "Also when a machine is down and has to run again urgently."
  - titel: "Engineering in-house"
    tekst: "Every repair is looked at through an engineer's eyes: why did it break, and how do you stop it happening again."

diensten:
  label: "Services"
  titel: "Weld, repair, design"
  items:
    - id: laswerk
      titel: "On-site welding"
      tekst: "Repairing, reinforcing and modifying parts where they are: cracks, broken parts, brackets, frames and one-off pieces. Worn parts get a new wear layer. The service van is equipped for all welding work on site."
      lijst:
        - "Steel, stainless steel and aluminium"
        - "Cast iron, with preheating and controlled cooling"
        - "Stick (MMA), MIG/MAG and TIG"
        - "Hardfacing and build-up welding: teeth, knives, blades, rollers, shafts and bearing seats"
        - "Drilling out broken bolts and repairing threads"
        - "Fabrication and custom work by arrangement"
    - id: onderhoud
      titel: "Repair and maintenance"
      tekst: "Repairs to steelwork, machines and installations: mechanical, electrical, pneumatic, hydraulic and steam. Often with welding involved, but not always. Planned preventive maintenance, or tracking down and fixing a fault when the machine stops."
      lijst:
        - "Bearings, shafts, drives and guides"
        - "Machine motors, sensors and control cabinets"
        - "Cylinders, valves, hoses and hydraulic lines"
        - "Steam systems: lines, valves, steam traps and supports"
      noot: "Electrical work on machines only, no building installations. Welding on steam lines by arrangement."
    - id: crash
      titel: "Bringing a machine back after a crash"
      tekst: "Hit, tipped over or badly damaged. Broken parts are welded, the mechanics realigned, the electrical, pneumatic and hydraulic side repaired, and the machine set up again until it is back in production. Where needed, outdated parts or controls are replaced or upgraded."
      noot: "Welding, mechanics, electrics and controls in one job."
    - id: engineering
      titel: "Engineering, controls and robots"
      tekst: "Design and drawings in Autodesk Inventor: modifications, reinforcements, brackets, guards and replacement parts. As part of a repair or as a separate job. Also changes to machine control systems and robot programs."
      lijst:
        - "CAD design and workshop drawings (Autodesk Inventor)"
        - "Measuring and redrawing worn or broken parts"
        - "PLC and machine control changes"
        - "Robot program changes: KUKA, ABB and FANUC"
        - "Repairing robot cells, grippers and fixtures"
    - id: spoed
      titel: "Urgent call-outs"
      tekst: "For breakdowns and breakages, especially when welding is needed. Urgent call-outs are first and foremost for regular customers. Other requests depend on availability."

spoed:
  label: "Urgent"
  titel: "Machine down?"
  tekst: "For regular customers, Werkhuizen Beckers is also on hand for urgent breakdowns. New customer? Feel free to call and see what is possible."

werkwijze:
  label: "Process"
  titel: "How it works"
  stappen:
    - titel: "Send a photo or call"
      tekst: "A photo by WhatsApp or email often says more than a long explanation. Mention where the machine is."
    - titel: "Assessment"
      tekst: "What needs repairing, and which equipment goes along? That is settled before anyone sets off."
    - titel: "Repair on site"
      tekst: "With the service van and the right tools. The machine stays where it is."
    - titel: "Invoice, done"
