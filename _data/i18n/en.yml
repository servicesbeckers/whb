over:
  label: "About"
  titel: "Lander Beckers"
  tekst:
    - "I run Werkhuizen Beckers and I am an engineer by training. Even so, I choose to work hands-on: welding, fixing and troubleshooting happen at the machine, not behind a desk."
    - "That background helps when a repair takes more than a weld. The question is not just where something broke, but why."
    - "At Werkhuizen Beckers you can be helped in English, Dutch and German."
  attesten_titel: "Certificates and insurance"
  attesten:
    - "VCA VOL safety certificate"
    - "BA4 and BA5 electrical qualifications"
    - "Forklift certificate"
    - "Insured: public and professional liability"
  foto_alt: "Lander Beckers welding at a customer's site"
  foto_bijschrift: "Lander Beckers, managing director"

faq:
  label: "FAQ"
  titel: "Frequently asked questions"
  items:
    - vraag: "Do you work outside Limburg?"
      antwoord: "Yes. Up to about an hour's drive from Gingelom: Hesbaye, Leuven, the eastern edge of Brussels, Mechelen, Liège, Verviers and Namur. Further afield is possible by arrangement."
    - vraag: "Does the machine need to be dismantled?"
      antwoord: "Usually not. Welding and repairs are done where the machine stands. If a part has to come off to reach the damage, that is done on site."
    - vraag: "Which materials do you weld?"
      antwoord: "Steel, stainless steel, aluminium and cast iron. Stick (MMA), MIG/MAG or TIG, depending on the job and the location. Worn parts can also be hardfaced."
    - vraag: "Do you do electrical work too?"
      antwoord: "On machines only: motors, sensors, control cabinets and the wiring on the machine. Building electrics are not included."
    - vraag: "Can you just make a drawing or a design?"
      antwoord: "Yes. CAD design and workshop drawings in Autodesk Inventor are also available as a separate job, for example for a modification, a bracket or a replacement part you have made elsewhere."
    - vraag: "Do you also change robot programs?"
      antwoord: "Yes, for KUKA, ABB and FANUC. For example after a repair or a change to the cell, when positions or paths have to be set again."
    - vraag: "How do I send a photo of the problem?"
      antwoord: "Through WhatsApp to +32 456 16 40 51 or by email to info@werkhuizenbeckers.be. Add the location and a short description."

