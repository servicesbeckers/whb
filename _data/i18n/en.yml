hero:
  label: "Gingelom · Limburg and the surrounding area"
  titel: "On-site welding & machine repair"
  tekst: "I come to you with my fully equipped van. I weld steel, stainless steel and aluminium, and get machines running again, mechanically and electrically."
  plaat:
    - [ "Work", "Weld · repair · adjust" ]
    - [ "Material", "Steel · stainless · alu" ]
    - [ "Process", "MMA · MIG/MAG · TIG" ]
    - [ "Base", "Gingelom" ]
  plaat_titel: "Mobile workshop"

troeven:
  - titel: "I come to you"
    tekst: "No dismantling, no transport to a workshop. The machine stays where it is."
  - titel: "One person for everything"
    tekst: "Welding, mechanics, machine electrics, pneumatics and hydraulics. You call one number, not three companies."
  - titel: "Quick to deploy"
    tekst: "Also when a machine is down and has to run again urgently."
  - titel: "Engineer by training"
    tekst: "I understand how the machine works. A repair is more than a weld."

diensten:
  label: "Services"
  titel: "What I do on site"
  items:
    - id: laswerk
      titel: "On-site welding"
      tekst: "Repairing, reinforcing and modifying parts where they are: cracks, broken parts, brackets, frames and one-off pieces. My van carries a complete welding setup."
      lijst:
        - "Steel, stainless steel and aluminium"
        - "Stick (MMA), MIG/MAG and TIG"
        - "Fabrication and custom work by arrangement"
    - id: onderhoud
      titel: "Machine maintenance and repair"
      tekst: "Mechanical, electrical, pneumatic and hydraulic. Planned preventive maintenance, or tracking down and fixing a fault when the machine stops."
      lijst:
        - "Bearings, shafts, drives and guides"
        - "Machine motors, sensors and control cabinets"
        - "Cylinders, valves, hoses and lines"
      noot: "Electrical work on machines only. No building installations."
    - id: crash
      titel: "Bringing a machine back after a crash"
      tekst: "Hit, tipped over or badly damaged. I weld what is broken, realign the mechanics, repair the electrical, pneumatic and hydraulic side, and set the machine up again until it is back in production. Where needed, I replace or upgrade outdated parts or controls."
      noot: "Welding, mechanics and electrics in one job, by one person."
    - id: spoed
      titel: "Urgent call-outs"
      tekst: "For breakdowns and breakages, especially when welding is needed. Urgent call-outs are first and foremost for regular customers. Other requests depend on availability."
  extra: "Where needed: CAD design (Autodesk Inventor) and changes to the machine control system (Beckhoff/TwinCAT) as part of a repair."

spoed:
  label: "Urgent"
  titel: "Machine down?"
  tekst: "For regular customers, I am also on hand for urgent breakdowns. New customer? Feel free to call and I will see what is possible."

werkwijze:
  label: "Process"
  titel: "How it works"
  stappen:
    - titel: "Send a photo or call"
      tekst: "A photo on WhatsApp often says more than a long explanation. Mention where the machine is."
    - titel: "Assessment"
      tekst: "I look at what needs repairing and which equipment to bring."
    - titel: "I come and fix it"
      tekst: "With the van and the right tools. The machine stays where it is."
    - titel: "Invoice, done"
      tekst: "You get an invoice listing the work. The machine is running again."

