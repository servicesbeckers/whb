title: Werkhuizen Beckers - Laswerk, onderhoud, CAD, besturing & machinebouw
email: info@werkhuizenbeckers.be
description: >-
  Probleem in, oplossing uit. We vertrekken vanuit uw probleem, niet vanuit een oplossing uit de catalogus: laswerk,
  onderhoud en herstelling van machineparken, CAD, PLC/HMI- en softwareprogrammatie en machinebouw (nieuw én retrofit)
  — mechanica en besturing in dezelfde hand.
url: "https://werkhuizenbeckers.be"
baseurl: ""
lang: nl-BE
markdown: kramdown
permalink: pretty

defaults:
  - scope:
      path: ""
    values:
      layout: page

sass:
  style: compressed

exclude:
  - README.md
  - Gemfile.lock
  - node_modules
  - vendor

plugins:
  - jekyll-sitemap
