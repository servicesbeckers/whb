<!doctype html>
<html lang="{{ page.lang | default: site.lang | default: 'nl-BE' }}">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>
        {% if page.title and page.title != 'Home' %}
        {{ page.title }} |
        {% endif %}
        {{ site.title }}
    </title>

    <meta name="description" content="{{ page.description | default: page.summary | default: page.excerpt | strip_html | strip_newlines | default: site.description }}">

    <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">

    <link rel="canonical" href="{{ page.url | replace:'index.html','' | absolute_url }}">

    <link rel="icon" type="image/png" sizes="48x48" href="{{ '/assets/img/apple-touch-icon-iphone-60x60.png' | relative_url }}">
    <link rel="icon" type="image/png" sizes="96x96" href="{{ '/assets/img/apple-touch-icon-iphone-76x76.png' | relative_url }}">

    <link rel="apple-touch-icon" href="{{ '/assets/img/apple-touch-icon-iphone-60x60.png' | relative_url }}">
    <link rel="apple-touch-icon" sizes="60x60" href="{{ '/assets/img/apple-touch-icon-ipad-76x76.png' | relative_url }}">
    <link rel="apple-touch-icon" sizes="114x114" href="{{ '/assets/img/apple-touch-icon-iphone-retina-120x120.png' | relative_url }}">
    <link rel="apple-touch-icon" sizes="144x144" href="{{ '/assets/img/apple-touch-icon-ipad-retina-152x152.png' | relative_url }}">
</head>
<body>
    {% include header.html %}

    <main class="site-main">
        {{ content }}
    </main>

    <footer class="site-footer">
        <div class="container footer-inner">
            <p>
                <strong>Werkhuizen Beckers</strong>
                <span class="footer-sep">·</span>
                Maatwerk in staal, RVS en aluminium
            </p>
            <p class="footer-copy">
                © 2026 Alle rechten voorbehouden - BTW: BE1009384770
            </p>
        </div>
    </footer>
</body>
</html>
