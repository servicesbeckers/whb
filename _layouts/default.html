<!doctype html>
<html lang="{{ page.lang | default: site.lang | default: 'nl-BE' }}">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>
        {% if page.title and page.title != 'Home' %}
        {{ page.title }} |
        {% endif %}
        {{ site.title }}
    </title>

    <meta name="description" content="{{ page.description | default: page.intro | default: site.description | strip_html | strip_newlines }}">
    <link rel="canonical" href="{{ page.url | absolute_url }}">

    <meta property="og:title" content="{% if page.title and page.title != 'Home' %}{{ page.title }} | {% endif %}{{ site.title }}">
    <meta property="og:description" content="{{ page.description | default: page.intro | default: site.description | strip_html | strip_newlines }}">
    <meta property="og:type" content="website">
    <meta property="og:url" content="{{ page.url | absolute_url }}">
    <meta property="og:locale" content="nl_BE">

    <meta name="theme-color" content="#121212">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
</head>
<body>
    {% include header.html %}

    <main id="main-content">
        {{ content }}
    </main>

    {% include footer.html %}

    <script>
    document.addEventListener('DOMContentLoaded', function () {
      const toggle = document.querySelector('.nav-toggle');
      const nav = document.querySelector('.site-nav');

      if (toggle && nav) {
        toggle.addEventListener('click', function () {
          const expanded = toggle.getAttribute('aria-expanded') === 'true';
          toggle.setAttribute('aria-expanded', String(!expanded));
          nav.classList.toggle('is-open');
        });
      }
    });
    </script>
</body>
</html>
